[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "network-simulator-backend"
version = "0.1.0"
description = "Backend for an AI-powered 3D networking simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx2",
    "ruff>=0.11,<1.0",
    "jsonschema>=4,<5",
]

database = [
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "jsonschema>=4,<5",
]

testing = [
    "pgserver>=0.1.4,<1.0",
    "pglast>=7,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Approved reference artifacts are preserved byte-for-byte and are not project source.
extend-exclude = ["contracts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
